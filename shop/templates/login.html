<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>
    <h1>Вход в систему</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="login" placeholder="Логин">
        <button type="submit">Войти</button>
    </form>
    {% if error %}<p style="color:red">{{error}}</p>{% endif %}
</body>
</html>
